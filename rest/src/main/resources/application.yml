spring:
  application:
    name: fullStackApp
  datasource:
    # In-memory database: data resets on restart. Point this at a file or real database to keep it.
    url: jdbc:h2:mem:people
    username: sa
    password: ""
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
  jpa:
    hibernate:
      # Liquibase owns the schema; Hibernate only checks it matches the entities.
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      # Off by default. Run with the dev profile to use it locally.
      enabled: false
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
