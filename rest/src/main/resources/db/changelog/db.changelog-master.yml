databaseChangeLog:
  - changeSet:
      id: 1-create-person
      author: Dino
      changes:
        - createTable:
            tableName: person
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(250)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(250)
                  constraints:
                    nullable: false
              - column:
                  name: nickname
                  type: VARCHAR(250)
                  constraints:
                    nullable: false
              - column:
                  name: birthday
                  type: DATE
                  constraints:
                    nullable: false
  - changeSet:
      id: 2-seed-person
      author: Dino
      changes:
        # No explicit id, so the identity column keeps counting correctly.
        - insert:
            tableName: person
            columns:
              - column: { name: first_name, value: Daniel }
              - column: { name: last_name, value: Talik }
              - column: { name: nickname, value: Dino }
              - column: { name: birthday, valueDate: "1988-09-20" }
